<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HTML Preview</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body.preview-off { visibility: hidden; }

        /* The preview doc is its own page (opaque origin). The frame ships
           with a bare sandbox (scripts off by default); Preview.js sets the
           right sandbox value before each load. */
        #preview-frame {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body class="preview-off">
    <iframe id="preview-frame" sandbox src="about:blank" title="HTML preview"></iframe>
    <script src="/host-client.js"></script>
    <script src="Preview.js"></script>
</body>
</html>
