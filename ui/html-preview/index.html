<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HTML Preview</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body.preview-off { visibility: hidden; }

        /* The preview document is its own page (opaque origin) — it brings
           its own look. The frame is full-bleed and borderless like the
           host editor surface. */
        #preview-frame {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body class="preview-off">
    <iframe id="preview-frame" sandbox="allow-scripts" src="about:blank" title="HTML preview"></iframe>
    <script src="/host-client.js"></script>
    <script src="Preview.js"></script>
</body>
</html>
