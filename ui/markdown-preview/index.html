<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Markdown Preview</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--color-bg-page);
            color: var(--color-text-primary);
            font-family: var(--font-sans);
        }
        a {
            color: var(--color-accent);
        }
        body.preview-off { visibility: hidden; }

        /* ── WYSIWYG (Wordgard) editing surface ────────────────────────────
           Like the host's code editor: borderless, on the page background. */
        #wg-container {
            box-sizing: border-box;
            height: 100%;
            overflow: hidden;
        }
        #wg-container wordgard-editor {
            /* Wordgard's theme variables, set here rather than on :root so they
               beat Wordgard's own scoped values. */
            --wg-border-color: var(--color-border);
            --wg-menu-color: var(--color-text-secondary);
            --wg-highlight-color: var(--color-accent-light);
            --wg-panel-color: var(--color-surface-2);
            /* Prose, so the app's UI font rather than a monospace one. */
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.6;
            color: var(--color-text-primary);
            caret-color: var(--color-text-primary);
            /* The host editor is borderless. */
            border: none !important;
            background: transparent;
        }
        #wg-container ::selection,
        #wg-container ::-moz-selection {
            background-color: var(--color-selection-bg);
        }
        /* Padding matches the host editor's inset. */
        #wg-container wg-content {
            padding: 8px 16px;
            caret-color: var(--color-text-primary);
        }

        #wg-container wg-content pre {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            line-height: 1.5rem;
            background: var(--color-surface-0);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin: 8px 0;
            overflow-x: auto;
        }
        #wg-container wg-content code {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            line-height: 1.25rem;
            background: var(--color-surface-0);
            border-radius: var(--radius-sm);
            padding: 2px 6px;
        }
        #wg-container wg-content pre code {
            background: none;
            padding: 0;
        }

        /* ── Menu bar (formatting toolbar) ─────────────────────────────────
           Styled like the host editor footer. */
        #wg-container wg-menubar {
            background: var(--color-surface-2);
            border-bottom: 1px solid var(--color-border);
            padding: 3px 8px;
            gap: 2px;
        }
        #wg-container .wg-menu-button {
            color: var(--color-text-secondary);
            border-radius: 4px;
        }
        #wg-container .wg-menu-button:hover {
            background: var(--color-surface-3);
            color: var(--color-text-primary);
        }
        #wg-container .wg-menu-button[aria-pressed] {
            color: var(--color-accent-light);
            background: var(--color-accent-bg);
        }

        /* Hide the toolbar's formatting that Markdown cannot round-trip: the
           serializer drops it, so it would silently leave the document.
           Preview.js removes the "More" submenu that held these items. */
        [title="More"],
        [title="Toggle underline"],
        [title="Toggle superscript"],
        [title="Toggle subscript"],
        [title="Text color"],
        [title="Background color"],
        [title="Alignment"],
        [title="Text direction"] {
            display: none !important;
        }
    </style>
</head>
<body class="preview-off">
    <!-- Loading/error UI is rendered by the host via the ui.* capability API. -->
    <script src="/host-client.js"></script>
    <script src="./lib/wordgard.js"></script>
    <script src="./serializer.js"></script>
    <script src="Preview.js"></script>
</body>
</html>
